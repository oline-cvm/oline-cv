<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="logo">OLINE</div>
      <p class="rail-note">Single-player OL breakdown<br/>Yeager framework v1</p>

      <form id="form" class="form">
        <label class="file">
          <input type="file" id="file" accept="video/*" hidden />
          <span id="file-label">Choose film</span>
        </label>

        <label>Jersey <span class="opt">OCR lock</span>
          <input type="number" id="jersey" value="76" min="0" max="99" />
        </label>

        <label>Play type
          <select id="play_type">
            <option value="pass" selected>Pass protection</option>
            <option value="run">Run blocking</option>
          </select>
        </label>

        <label>Snap frame <span class="opt">optional</span>
          <input type="number" id="snap" placeholder="auto" min="0" />
        </label>

        <button type="submit" id="run">Run</button>
        <button type="button" class="secondary" id="demo">Last result</button>
      </form>

      <p class="status" id="status"></p>
    </aside>

    <section class="main">
      <header class="head">
        <div>
          <h1 id="title">OL</h1>
          <p id="subtitle" class="muted">Locks #76 by jersey OCR · full-frame film</p>
        </div>
        <div class="tags" id="tags"></div>
      </header>

      <div class="workspace">
        <div class="viewer">
          <video id="preview" controls playsinline></video>
          <div class="viewer-empty" id="empty">No preview</div>
        </div>

        <div class="metrics">
          <div class="hero">
            <div class="k">Reaction</div>
            <div class="v" id="reaction">—</div>
            <div class="s" id="reaction-s">snap → first move</div>
          </div>

          <div class="grid" id="summary-grid"></div>
        </div>
      </div>

      <div class="modules" id="modules"></div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
