# BoT-SORT for oline-cv — GMC on, ReID on (detector features when model=auto)
# Copy of ultralytics defaults with identity-preserving tweaks.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 45
match_thresh: 0.8
fuse_score: True

gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.85
with_reid: True
model: auto
